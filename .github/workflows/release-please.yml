name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Never let two release runs race each other onto the same tag.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Reads the conventional commits landed on main since the last release and
      # keeps a "chore(release): x.y.z" PR up to date with the version bump and
      # generated CHANGELOG. Merging that PR is what actually cuts the release:
      # it creates the vX.Y.Z tag and the GitHub Release.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The versioned image has to be built from here rather than from a tag push.
  # release-please creates the tag with GITHUB_TOKEN, and GitHub will not start
  # a workflow from an event raised by that token, so `on: push: tags:` never
  # fires for it. Calling the build as a reusable workflow keeps it in this same
  # run, where no new event is needed.
  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-push.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
