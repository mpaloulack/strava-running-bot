name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Squash-merging makes the PR title the commit subject on main, which is
      # the only text release-please ever reads. A title it can't parse produces
      # no changelog entry and no version bump, silently.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            test
            refactor
            build
            style
            deps
            deps-dev
            docker
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase character
            (e.g. "add monthly leaderboard", not "Add monthly leaderboard").
